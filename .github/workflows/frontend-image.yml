name: Frontend Image CI/CD

on:
  push:
    tags:
      - "frontend-v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/airmetrics-frontend
  VITE_API_BASE_BACKEND_URL: /api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_TAG="frontend-manual-${GITHUB_SHA::7}"
          fi

          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME_LC}:frontend-latest"
            echo "${REGISTRY}/${IMAGE_NAME_LC}:${VERSION_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_BACKEND_URL=${{ env.VITE_API_BASE_BACKEND_URL }}
          tags: ${{ steps.prep.outputs.tags }}
