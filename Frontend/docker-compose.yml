services:
  frontend:
    image: ghcr.io/zsoltdedesi/airmetrics-frontend:frontend-latest
    pull_policy: always
    container_name: Airmetrics
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://192.168.1.155:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
    default:
        name: Airmetrics
x-casaos:
    author: self
    category: self
    hostname: ""
    icon: https://cdn-icons-png.flaticon.com/512/7974/7974720.png
    index: /
    is_uncontrolled: false
    port_map: "8090"
    scheme: http
    title:
        custom: Airmetrics
