services:
  frontend:
    image: ghcr.io/zsoltdedesi/frontend-airmetrics:frontend-latest
    pull_policy: always
    container_name: airmetrics-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
